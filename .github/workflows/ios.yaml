name: iOS

on:
  push:
    branches: [ sdl_touch_panel ]
  pull_request:

# One run at a time per ref, so a second push cannot race the first one's
# upload to the release below.
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

# Moving the tag and editing the release both write to the repository.
permissions:
  contents: write

jobs:
  build:
    name: iOS
    # macos-13 was retired; macos-26 is the current default image, and every
    # Xcode on it is a 26.x, so the step below has something to find.
    runs-on: macos-26
    steps:
      - name: Clone Project
        uses: actions/checkout@v4

      - name: Select an Xcode whose iOS SDK is below 27
        # iOS 27 traps apps linked against the iOS 27 SDK that have not
        # adopted the UIScene lifecycle, and SDL2 has not, so an .ipa built
        # against it dies at launch on an iOS 27 device.  Choose the newest
        # Xcode under that line rather than a fixed version, so an image
        # update cannot quietly move the build onto 27.
        run: |
          set -eu
          chosen=
          for xc in $(ls -d /Applications/Xcode*.app | sort -rV); do
            sdk=$("$xc/Contents/Developer/usr/bin/xcodebuild" -showsdks 2>/dev/null |
                  sed -n 's/.*-sdk iphoneos\([0-9][0-9]*\).*/\1/p' | sort -rn | head -1) || true
            if [ -n "${sdk:-}" ] && [ "$sdk" -lt 27 ]; then chosen=$xc; break; fi
          done
          if [ -z "$chosen" ]; then echo "no Xcode with an iOS SDK below 27"; exit 1; fi
          sudo xcode-select -s "$chosen"
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos

      - name: Configure
        run: |
          cmake \
            -B build \
            -G Xcode \
            -D CMAKE_TOOLCHAIN_FILE=src/cmake/toolchain/ios.toolchain.cmake \
            -D ENABLE_BITCODE=0 \
            -D PLATFORM=OS64 \
            -D CMAKE_SYSTEM_NAME=iOS \
            -D CMAKE_BUILD_TYPE=RelWithDebInfo \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY='' \
            -D SUPPORT_SDL2_FRONTEND=ON \
            -D CMAKE_POLICY_VERSION_MINIMUM=3.5 \
            # EOL

      - name: Build
        run: |
          cmake \
            --build build \
            --config RelWithDebInfo \
            -j $(sysctl -n hw.physicalcpu) \
            # EOL

      - name: Pack
        run: |
          cd build
          cpack -G ZIP -C RelWithDebInfo

      - name: Check the ipa
        # An .ipa is a zip whose whole content is Payload/<App>.app.  Catch a
        # mispackaged archive here rather than when someone tries to install
        # it, and confirm the font licence rode along as the OFL requires.
        run: |
          set -eu
          unzip -l build/Angband.ipa | grep -q ' Payload/Angband\.app/Info\.plist$'
          unzip -l build/Angband.ipa | grep -q ' Payload/Angband\.app/lib/fonts/JuliaMono-LICENSE\.txt$'

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Angband.ipa
          path:  build/Angband.ipa
          retention-days: 7

      - name: Attach to the continuous iOS release
        # Only from the branch itself: a pull request must not move the tag
        # or overwrite what is published.
        if: github.ref == 'refs/heads/sdl_touch_panel'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # One rolling tag, moved to whatever was just built, so the release
          # always holds the newest .ipa at a stable download URL.
          git push --force origin '${{ github.sha }}:refs/tags/continuous-ios'
          # printf keeps the notes clear of the indentation this block needs:
          # carried into the string, it would render as a code block.
          notes=$(printf '%s\n' \
            "Unsigned sideload build of the SDL2 touch panel branch, made on $(date -u '+%Y-%m-%d %H:%M') UTC from ${{ github.sha }}." \
            "" \
            "The .ipa is not code signed: install it with something that signs as it installs, such as Sideloadly or AltStore.  This is an automated build of a development branch and may be unstable." \
            "" \
            "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          if gh release view continuous-ios >/dev/null 2>&1; then
            gh release edit continuous-ios --title 'Continuous iOS build' \
              --notes "$notes" --prerelease
          else
            gh release create continuous-ios --title 'Continuous iOS build' \
              --notes "$notes" --prerelease
          fi
          gh release upload continuous-ios build/Angband.ipa --clobber
